version: '3.8'

services:
  iris-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iris_container
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
      - "8501:8501"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    tty: true
    stdin_open: true
